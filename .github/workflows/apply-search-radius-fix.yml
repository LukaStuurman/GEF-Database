name: Apply GEF search radius fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-search-radius-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch search radius behavior
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          function replaceOnce(path, from, to) {
            const source = fs.readFileSync(path, "utf8");
            if (!source.includes(from)) {
              throw new Error(`Expected text not found in ${path}: ${from}`);
            }
            fs.writeFileSync(path, source.replace(from, to));
          }

          const component = "app/components/gef-map.client.tsx";
          replaceOnce(
            component,
            "const NEARBY_LOCATION_RADIUS_KM = 10;\n",
            "",
          );
          replaceOnce(
            component,
            ".filter((location) => location.distanceKm <= NEARBY_LOCATION_RADIUS_KM)",
            ".filter((location) => location.distanceKm <= selectionRadiusKm)",
          );
          replaceOnce(
            component,
            "  }, [focusedSearchResult, locations]);",
            "  }, [focusedSearchResult, locations, selectionRadiusKm]);",
          );
          replaceOnce(
            component,
            `            {nearbyLocations.length > 0\n              ? t("mapNearbyFiles", { count: nearbyLocations.length })\n              : t("mapNearbyFilesNone")}`,
            `            {nearbyLocations.length > 0\n              ? t("mapNearbyFiles", {\n                  count: nearbyLocations.length,\n                  radius: selectionRadiusKm.toLocaleString(i18n.language, {\n                    maximumFractionDigits: 2,\n                  }),\n                })\n              : t("mapNearbyFilesNone", {\n                  radius: selectionRadiusKm.toLocaleString(i18n.language, {\n                    maximumFractionDigits: 2,\n                  }),\n                })}`,
          );

          replaceOnce(
            "app/locales/nl.ts",
            `    mapNearbyFiles: "{{count}} GEF-locaties binnen 10 km",\n    mapNearbyFilesNone: "Geen GEF-locaties gevonden binnen 10 km.",`,
            `    mapNearbyFiles: "{{count}} GEF-locaties binnen {{radius}} km",\n    mapNearbyFilesNone:\n      "Geen GEF-locaties gevonden binnen {{radius}} km.",`,
          );
          replaceOnce(
            "app/locales/en.ts",
            `    mapNearbyFiles: "{{count}} GEF locations within 10 km",\n    mapNearbyFilesNone: "No GEF locations were found within 10 km.",`,
            `    mapNearbyFiles: "{{count}} GEF locations within {{radius}} km",\n    mapNearbyFilesNone:\n      "No GEF locations were found within {{radius}} km.",`,
          );
          NODE

      - name: Remove one-off workflow and commit fix
        shell: bash
        run: |
          git rm .github/workflows/apply-search-radius-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/gef-map.client.tsx app/locales/nl.ts app/locales/en.ts
          git commit -m "Fix GEF search radius to follow configured radius"
          git push
